# ollama-claude.conf - the only place to edit when models change
# Format: one KEY=VALUE per line. '#' comments and blank lines are ignored.
# Empty values are valid (e.g. ANTHROPIC_API_KEY=).
# The keys here ARE the environment variables; 'cc claude' clears exactly these.
# Comments ('#') must start in column 1 - do not indent comments or keys.
ANTHROPIC_BASE_URL=http://localhost:11434
ANTHROPIC_AUTH_TOKEN=ollama
ANTHROPIC_API_KEY=
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT=1
ANTHROPIC_MODEL=deepseek-v4.1-flash:cloud
ANTHROPIC_DEFAULT_FABLE_MODEL=kimi-k3:cloud
ANTHROPIC_DEFAULT_OPUS_MODEL=deepseek-v4-pro:cloud
ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-v4.1-flash:cloud
ANTHROPIC_DEFAULT_HAIKU_MODEL=nemotron-3-nano:30b-cloud
CLAUDE_CODE_SUBAGENT_MODEL=nemotron-3-nano:30b-cloud
CLAUDE_CODE_EFFORT_LEVEL=high
